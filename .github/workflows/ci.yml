name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Playwright 1.58 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Installs the Rust toolchain pinned in mise.toml (with clippy and rustfmt).
      # cargo-edit is only needed locally for upgrades, so it is skipped here.
      - uses: jdx/mise-action@v5
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Check browser client
        run: cargo clippy -p eins_web --target wasm32-unknown-unknown --locked -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1

      - name: Build web release
        working-directory: eins_web
        run: trunk build --release --locked

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eins_web/package-lock.json

      - name: Test browser gameplay
        working-directory: eins_web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
