name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Rust toolchain pinned in mise.toml (with clippy and rustfmt).
      # cargo-edit is only needed locally for upgrades, so it is skipped here.
      - uses: jdx/mise-action@v5
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
