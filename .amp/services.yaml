services:
  # Activate tools after the supervisor loads its environment; login-shell PATH can be reset.
  eins-api:
    command: mise exec -- cargo run -p eins_server --locked
    port: 8080
    health: /health

  eins-web:
    command: mise exec -- trunk serve --release --locked --address 0.0.0.0 --port "$PORT"
    cwd: eins_web
    port: 8082
    health: /api/health
    portal:
      title: Eins web client
      description: Choose a nickname to play. Open a fresh tab for another player. Server restarts reset games and sessions.
